<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Design</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
overflow:hidden;
}

/* Background Liquid Blobs */
.blob{
position:absolute;
width:450px;
height:450px;
border-radius:50%;
filter:blur(100px);
animation:blobMove 15s infinite alternate ease-in-out;
}

.blob1{
background:linear-gradient(45deg,#00f5ff,#0077ff);
top:-100px;
left:-100px;
}

.blob2{
background:linear-gradient(45deg,#ff00cc,#ff6600);
bottom:-100px;
right:-100px;
animation-delay:4s;
}

@keyframes blobMove{
0%{transform:translate(0,0) scale(1);}
50%{transform:translate(120px,-80px) scale(1.2);}
100%{transform:translate(-80px,120px) scale(0.9);}
}

/* Glass Container */
.container{
position:relative;
z-index:10;
display:flex;
gap:30px;
flex-direction:column;
}

/* Liquid Glass Button */
.liquid-btn{
position:relative;
padding:16px 40px;
border:none;
border-radius:50px;
cursor:pointer;
font-size:16px;
color:white;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.3);
overflow:hidden;
transition:0.4s ease;
}

/* Animated Liquid Inside */
.liquid-btn::before{
content:"";
position:absolute;
width:180%;
height:250%;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(0deg);
border-radius:45%;
animation:rotate 7s linear infinite;
z-index:-1;
opacity:0.8;
}

/* Different gradient for each button */
.btn1::before{
background:linear-gradient(45deg,#00f5ff,#0077ff,#00f5ff);
}

.btn2::before{
background:linear-gradient(45deg,#ff00cc,#ff6600,#ff00cc);
}

@keyframes rotate{
0%{transform:translate(-50%,-50%) rotate(0deg);}
100%{transform:translate(-50%,-50%) rotate(360deg);}
}

.liquid-btn:hover{
transform:scale(1.08);
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

</style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="container">
<button class="liquid-btn btn1" onclick="goSite1()">
View Only</button>

<button class="liquid-btn btn2" onclick="goSite2()">
Feel Drag & Drop </button>
</div>

<script>
function goSite1(){
window.location.href="/View/";
}

function goSite2(){
window.location.href="/Drag&Drop/";
}
</script>

</body>
</html>
